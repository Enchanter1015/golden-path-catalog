AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Golden Path Catalog v1 — Static Hosting Component.
  Provisions S3 bucket and CloudFront distribution in a single stack.
  Private bucket accessed only via CloudFront Origin Access Control.

Parameters:
  Team:        { Type: String }
  Environment: { Type: String, AllowedValues: [dev, staging, prod] }
  ProjectName: { Type: String }
  AppVersion:  { Type: String }
  ManagedBy:   { Type: String, Default: "CloudFormation" }

Resources:

  HostingBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      Tags:
        - { Key: Team,        Value: !Ref Team }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: AppVersion,  Value: !Ref AppVersion }
        - { Key: ManagedBy,   Value: !Ref ManagedBy }
        - { Key: GoldenPath,  Value: "true" }

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref HostingBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${HostingBucket}/*'

  CDNDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !Select
              - 1
              - !Split ["//", !GetAtt HostingBucket.WebsiteURL]
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD]
          CachedMethods:  [GET, HEAD]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
      Tags:
        - { Key: Team,        Value: !Ref Team }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: AppVersion,  Value: !Ref AppVersion }
        - { Key: ManagedBy,   Value: !Ref ManagedBy }
        - { Key: GoldenPath,  Value: "true" }

Outputs:
  BucketName:
    Value: !Ref HostingBucket
    Export: { Name: !Sub '${AWS::StackName}-BucketName' }
  DistributionURL:
    Value: !Sub 'https://${CDNDistribution.DomainName}'
    Export: { Name: !Sub '${AWS::StackName}-DistributionURL' }
  DistributionId:
    Value: !Ref CDNDistribution
    Export: { Name: !Sub '${AWS::StackName}-DistributionId' }