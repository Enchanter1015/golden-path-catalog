AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Golden Path Catalog v1 — CloudFront CDN Component.
  Provisions a CloudFront distribution in front of an S3 static origin.
  Enforces HTTPS via redirect-to-https viewer protocol policy.
 
Parameters:
  Team:         { Type: String }
  Environment:  { Type: String }
  ProjectName:  { Type: String }
  AppVersion:   { Type: String }
  ManagedBy:   { Type: String, Default: "CloudFormation" }
  HostingStack: { Type: String, Description: Name of the deployed hosting stack }
 
Resources:
 
  CDNDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !ImportValue
              Fn::Sub: '${HostingStack}-WebsiteURL'
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
      Tags:
        - { Key: Team,        Value: !Ref Team }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: AppVersion,  Value: !Ref AppVersion }
 
Outputs:
  DistributionURL:
    Value: !Sub 'https://${CDNDistribution.DomainName}'
    Export: { Name: !Sub '${AWS::StackName}-DistributionURL' }
  DistributionId:
    Value: !Ref CDNDistribution
    Export: { Name: !Sub '${AWS::StackName}-DistributionId' }
